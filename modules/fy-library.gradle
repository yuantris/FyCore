// fy-library.gradle —— FyCore 2.0 子模块统一配置模板
// 使用方式（模块 build.gradle）：
//   ext {
//       fyNamespace = 'io.core.kernel'   // 必填：AGP namespace（R/BuildConfig 所在包）
//       // fyViewBinding = true          // 可选：开启 viewBinding
//       // fyDataBinding = true          // 可选：开启 dataBinding
//   }
//   apply from: '../fy-library.gradle'

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace project.ext.fyNamespace
    compileSdk 36

    defaultConfig {
        minSdk 24
        def consumerRules = file('consumer-rules.pro')
        if (consumerRules.exists()) {
            consumerProguardFiles consumerRules.absolutePath
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(11))
        }
    }

    kotlin {
        jvmToolchain(11)
        kotlinOptions {
            freeCompilerArgs = ['-Xjvm-default=all-compatibility']
        }
    }

    buildFeatures {
        if (project.findProperty('fyViewBinding') == true) viewBinding true
        if (project.findProperty('fyDataBinding') == true) dataBinding true
    }
}
