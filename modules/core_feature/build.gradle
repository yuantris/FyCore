plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'maven-publish'
}

android {
    namespace 'io.core'
    compileSdk 35

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "proguard-rules.pro"
    }

    sourceSets {
        main {
            // res 资源目录配置
            res.srcDirs(
                    'src/main/res',
                    'src/main/res-dimen',
            )
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(11))
        }
    }

    kotlin {
        jvmToolchain(11) // 确保使用的是支持该特性的 JVM 版本
        kotlinOptions {
            freeCompilerArgs = ['-Xjvm-default=all-compatibility']
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

}


dependencies {

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    api libs.google.gson
    api libs.activity.ktx
    api libs.recyclerview
    api libs.preference.ktx
    api libs.lifecycle.livedata.ktx
    api libs.lifecycle.viewmodel.ktx
    api libs.lifecycle.runtime.ktx
    api libs.navigation.fragment.ktx
    api libs.navigation.ui.ktx
    api libs.kotlinx.serialization.json
    implementation libs.flexbox
    implementation libs.kotlin.reflect
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    compileOnly libs.room.ktx
    //noinspection KaptUsageInsteadOfKsp
    kapt libs.room.compiler
    annotationProcessor libs.room.compiler

    // Glide
    compileOnly(libs.glide)
    // 权限请求框架
    compileOnly libs.xxpermissions

    // https://github.com/gyf-dev/ImmersionBar
    api libs.immersionbar
    api libs.immersionbar.ktx

    // https://github.com/liangjingkanji/BRV
    api libs.refresh.layout.kernel
    api libs.refresh.header.material
    api libs.refresh.footer.classics
}

