plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'maven-publish'
}

android {
    namespace 'io.core'
    compileSdk 34

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "proguard-rules.pro"
    }

    sourceSets {
        main {
            // res 资源目录配置
            res.srcDirs(
                    'src/main/res',
                    'src/main/res-dimen',
            )
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

}


dependencies {

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation(libs.flexbox)
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    api libs.activity.ktx
    api libs.recyclerview
    api libs.preference.ktx
    api libs.google.gson
    api libs.lifecycle.livedata.ktx
    api libs.lifecycle.viewmodel.ktx
    api libs.lifecycle.runtime.ktx
    api libs.navigation.fragment.ktx
    api libs.navigation.ui.ktx
    implementation libs.kotlin.reflect

    compileOnly libs.room.ktx
    //noinspection KaptUsageInsteadOfKsp
    kapt libs.room.compiler
    annotationProcessor libs.room.compiler

    //Glide
    compileOnly(libs.glide)

    // https://github.com/liangjingkanji/BRV
    compileOnly(libs.brv) {
        exclude group: 'com.github.liangjingkanji', module: 'StateLayout'
    }

    compileOnly libs.xxpermissions

    // https://github.com/gyf-dev/ImmersionBar
    compileOnly libs.immersionbar
    compileOnly libs.immersionbar.ktx

    // https://github.com/Blankj/AndroidUtilCode
    compileOnly libs.utilcodex

    // ShapeView：https://github.com/getActivity/ShapeView
    compileOnly libs.shapeView
    // ShapeDrawable：https://github.com/getActivity/ShapeDrawable
    compileOnly libs.shapedrawable
}

/*当前版本*/
version libs.versions.fycore.get()

publishing {
    publications {
        // register 和 create 都类似，这里用 create
        create("lib-base", MavenPublication) {
            // 配置信息，使用: classpath("groupId:artifactId:version") (不能有空格)
            groupId = "io.core"
            artifactId = "fylibs"
            version = project.version

            // 这条要加上，不然不会包含代码文件
            afterEvaluate {
                from components.release
            }
        }
    }
    repositories {
        // 远程仓库
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/yuantris/FyCore")
            credentials {
                username = 'yuantris'
