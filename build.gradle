// Top-level build file where you can add configuration options common to all sub-projects/modules.

//添加 repositories.gradle
apply from: 'app/repositories.gradle'
apply from: 'custom-maven.gradle'

buildscript {
    // AGP/Kotlin/KSP 插件均可在公共仓库获取，私有云效仓库凭据已外置（见 maven-credentials.gradle）
    repositories {
        maven { url 'https://jitpack.io' }
        mavenCentral()
        google()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
        classpath libs.ksp.gradle.plugin
    }
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        mavenCentral()
        google()
    }
}

ext {
    // FyCore 2.0 统一版本号：-Prelease 发布正式版，默认 SNAPSHOT
    fyVersionBase = '2.0.0'
    fyVersion = project.hasProperty('release') ? fyVersionBase : "${fyVersionBase}-SNAPSHOT"
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
