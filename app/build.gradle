plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.core.fy.android'
    compileSdk 33

    defaultConfig {
        applicationId "com.core.libraries"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

// 选择依赖版本
// libs.versions.local.get()  本地模块
// libs.versions.jitpack.get() GitHub Jitpack版本
// libs.versions.package.get() GitHub package版本
def version = libs.versions.local.get()

ext {
    fycoreDependencies = [
            jitpack: libs.fycore.github,
            package: libs.fycore.git.package,
            local : project(':core_feature')
    ]
}

dependencies {

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation fycoreDependencies[version]

    // 动画解析库：https://github.com/airbnb/lottie-android
    // 动画资源：https://lottiefiles.com、https://icons8.com/animated-icons
    implementation libs.lottie

    implementation libs.room.ktx
    kapt libs.room.compiler
    annotationProcessor libs.room.compiler
}
