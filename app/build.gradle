plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.core.fy.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.core.fy.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        renderscriptTargetApi 21
        renderscriptSupportModeEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(11))
        }
    }

    kotlin {
        jvmToolchain(11)
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation(libs.flexbox)
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.core.splashscreen
    implementation libs.annotations

    // FyCore 模块依赖
    implementation project(':modules:core-nav')
    
    debugImplementation libs.leakcanary.android

    implementation libs.room.ktx
    //noinspection KaptUsageInsteadOfKsp
    kapt libs.room.compiler
    annotationProcessor libs.room.compiler

    //media
    implementation(libs.media.media)
    // For media playback using ExoPlayer
    implementation(libs.media3.exoplayer)

    //Glide
    implementation(libs.glide)

    // 动画解析库：https://github.com/airbnb/lottie-android
    implementation libs.lottie
    implementation libs.xxpermissions

    // https://github.com/Blankj/AndroidUtilCode
    implementation libs.utilcodex

    // https://github.com/kongzue/DialogX
    implementation libs.kongzue.dialogx
    implementation libs.dialogxkongzuestyle

    // https://github.com/junixapp/XPopup
    implementation libs.xpopup

    // https://github.com/Tencent/MMKV
    implementation libs.mmkv

    // https://github.com/arthenica/ffmpeg-kit/tree/main/android
    implementation libs.ffmpeg.kit.full

    implementation("com.squareup.okhttp3:okhttp:4.10.0")  // OkHttp

    def camerax_version = "1.2.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"
}
