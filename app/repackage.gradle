            String htmlTd = "<tr><td><img src='/android/${flavor.dname}/${flavor.applicationId}/${flavor.versionCode}/release_${prodName}.jpg?v=" + (int) (Math.random() * 10000000) + "' width='120'></td>"
            String htmlTLd = "<tr><td><a href='/back/app/${btimes}/${flavor.dname}/${flavor.applicationId}/${flavor.versionCode}/release_${prodName}.apk?v=" + (int) (Math.random() * 10000000) + "'>备份包-点击下载</a></td>"


