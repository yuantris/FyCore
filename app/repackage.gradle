                buildConfigField 'String', 'Tencent_INFO_FLOW_ID', '""'
                buildConfigField 'String', 'Tencent_INFO_FLOW_LEFT_ID', '""'
                buildConfigField 'String', 'JRTT_APP_ID', '""'
                buildConfigField 'String', 'JRTT_COOPEN_ID', '""'
                buildConfigField 'String', 'JRTT_BANNER_ID', '""'
