            //替换隐私协议
            task updateAppAgrt {

                File assets_file = new File("${projectDir.path}/" + flavor.agrt.yhxy.to)
                assets_file.listFiles().each { file ->

                    if (file.name.length() == 17 && file.name.contains(".json") && !file.name.contains(flavors[0].appid)) {
                        println "<------>删除多余短视频文件---->${file.name}---------------------------------------------->"
                    }
                    if (file.name.length() == 13 && !file.name.contains(".") && !file.name.contains(flavors[0].appid) && file.name.endsWithAny("1", "2")) {
                        file.delete()
