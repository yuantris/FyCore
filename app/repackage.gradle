def getAdMap(modules) {
    def adMap = [:]
    modules.each { adtype ->
        adtype.each { key, ad ->
            if (ad instanceof Collection && !ad.isEmpty()) {
                ad.each {
                    adInfo ->
                        adMap[adInfo.adId] = adInfo.id
                }
            }
        }
    }
    return adMap
}

def getEasyTestAdMap(modules) {
    def easyTestMap = [:]
    modules.each { module ->
        module.each { key, ad ->
            if (ad instanceof Collection && !ad.isEmpty()) {
                ad.each {
                    adInfo ->
                        easyTestMap[adInfo.adId] = [t: key, tid: adInfo.adId, n: adInfo.name]
                }
            }
        }
    }
    return easyTestMap
}

def updateStr(String path, old_str, new_str) {
    //重新写入到文件中
    def updatedContent = new File(path).getText('UTF-8').replaceAll(old_str, new_str)
    new File(path).write(updatedContent, 'UTF-8')
}

def updateStr(File file, old_str, new_str) {
    //重新写入到文件中
    def updatedContent = file.getText('UTF-8').replaceAll(old_str, new_str)
    file.write(updatedContent, 'UTF-8')
}


/**
 * 创建assets配置信息文件,必须在mergeAssets前执行
 * @param configs
 * @return
 */
def createConfigsJson(appid, configs, file) {
    def configsJson = JsonOutput.toJson(configs)
    configsJson = AESCodec.encrypt(appid, configsJson)
    file.write(configsJson, "utf-8")
    println "<------>配置信息写入assets文件:configs -------------------->"
}
/**
 * 文件信息加密
 * @param pwd 加密密钥
 * @param src 加密源文件
 * @param des 加密后的文件
 * @return
 */
def encryptFile(pwd, File src, File des, boolean deleteSrc) {
    if (des.exists()) {
        des.delete()
    }
    des.write(AESCodec.encrypt(pwd, src.getText("UTF-8")), "utf-8")
    if (deleteSrc) {
        src.delete()
    }
    println "<------>文件:${src.getName()}加密成功,输出：${des.getName()} ---------------------------------------->"
}

/**
 * 替换清单文件权限
 * @param xmlFile
 * @return
 */
def updateManifest(String xmlFile, boolean isXiaoMi, boolean isNoTx) {

    def android = new Namespace('http://schemas.android.com/apk/res/android', 'android')
    def tools = new Namespace('http://schemas.android.com/tools', 'tools')
    if (!new File(xmlFile).exists()) {
        return
    }

    //直接修改AndroidManifest文本--->START--->

    def manifestContent = file(xmlFile).getText()

    if (!manifestContent.contains("xmlns:tools=\"http://schemas.android.com/tools\"")) {
        updateStr(xmlFile, 'xmlns:android="http://schemas.android.com/apk/res/android"', 'xmlns:android="http://schemas.android.com/apk/res/android"\nxmlns:tools="http://schemas.android.com/tools"')
        println "<------>替换xmlns:tools---完毕------------------------------------------------------------->"
    }

    //适配zytest网络抓包
    if (!manifestContent.contains('android:networkSecurityConfig')) {
        updateStr(xmlFile, '<application', '<application android:networkSecurityConfig="@xml/network_security_config"')
        println "<------>增加android:networkSecurityConfig=\"@xml/network_security_config\"---完毕-------->"
    } else if (!manifestContent.contains('android:networkSecurityConfig="@xml/network_security_config"')) {
        String patternString = "android:networkSecurityConfig=\"@xml/([^\"]+)\""
        Matcher matcher = Pattern.compile(patternString).matcher(manifestContent)
        if (matcher.find()) {
            String extractedString = matcher.group(0)
            updateStr(xmlFile, extractedString, 'android:networkSecurityConfig="@xml/network_security_config"')
            println "<------>替换android:networkSecurityConfig=\"@xml/network_security_config\"---完毕-------->"
        }
    }

    //适配旧的存储权限模式
    if (!manifestContent.contains('android:requestLegacyExternalStorage')) {
        updateStr(xmlFile, '<application', '<application android:requestLegacyExternalStorage="true"')
        println "<------>增加requestLegacyExternalStorage=true---完毕-------------------------------------->"
    } else if (manifestContent.contains('android:requestLegacyExternalStorage="false"')) {
        updateStr(xmlFile, 'android:requestLegacyExternalStorage="false"', 'android:requestLegacyExternalStorage="true"')
        println "<------>替换requestLegacyExternalStorage=true---完毕-------------------------------------->"
    }

    //适配api24出包
    if (!manifestContent.contains('android:extractNativeLibs')) {
        updateStr(xmlFile, '<application', '<application android:extractNativeLibs="true"')
        println "<------>增加extractNativeLibs=true---完毕-------------------------------------->"
    } else if (manifestContent.contains('android:extractNativeLibs="false"')) {
        updateStr(xmlFile, 'android:extractNativeLibs="false"', 'android:extractNativeLibs="true"')
        println "<------>替换extractNativeLibs=true---完毕-------------------------------------->"
    }

//    //小米渠道移除所有存储权限
//    if (isXiaoMi) {
//        if (manifestContent.contains("android.permission.MANAGE_EXTERNAL_STORAGE")) {
//            updateStr(xmlFile, "android.permission.MANAGE_EXTERNAL_STORAGE", "android.permission.INTERNET")
//            println "<------>替换MANAGE_EXTERNAL_STORAGE为INTERNET---完毕---sdk已修改为surfaceview----------------------------->"
