                println "<------>替换 gradle UMSDK【apm】           到最新版本----->${apm}------------------------>"
                println "<------>替换 gradle UMSDK【uyumao】        到最新版本----->${uyumao}------------------------>"
                println "<------>替换权限申请框架                   到最新版本----->${xxpers}------------------------->"


				dependencies.add("implementation", 'com.umeng.umsdk:common:' + umv)
				dependencies.add("implementation", 'com.umeng.umsdk:asms:' + asms)
				dependencies.add("implementation", 'com.umeng.umsdk:apm:' + apm)
				dependencies.add("implementation", 'com.umeng.umsdk:nns:' + nns)
				dependencies.add("implementation", 'com.umeng.umsdk:uyumao:' + uyumao)

				if (flavor.keys.umeng_auth.length() > 0) {
					dependencies.add("implementation", 'com.umeng.umsdk:uverify:' + uverify)
					dependencies.add("implementation", 'com.umeng.umsdk:uverify-main:' + uverifymain)
					dependencies.add("implementation", 'com.umeng.umsdk:uverify-logger:' + uverifylog)
					println "<------>替换 gradle UMSDK【uverify】          到最新版本----->${uverify}-------------------->"
					println "<------>替换 gradle UMSDK【uverify-main】     到最新版本----->${uverifymain}------------------->"
					println "<------>替换 gradle UMSDK【uverify-log】      到最新版本----->${uverifylog}------------------->"
				}


                configurations.all {
                    if (flavor.sdk.zy.contains("SNAPSHOT")) {
                        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
                    }
                    resolutionStrategy {
                        // 遍历依赖
                        eachDependency { details ->
                            // 为指定依赖指定固定版本d
                            if (details.requested.group == 'com.zy.sdk') {
                                if (details.requested.name == 'ad-core-androidx') {
                                    details.useVersion flavor.sdk.zy
                                    //更新所有核心包到V4版本
                                    updateStr("${projectDir.path}/build.gradle", "ad-core-androidx", "ad-core-android")
//                                    println "<------>替换gradle SDK 版本----->" + details.requested.name + ":" + details.requested.version + "---为--->" + flavor.sdk.zy + "------>"
                                } else if (details.requested.name == 'ad-core-android') {
                                    details.useVersion flavor.sdk.zy
//                                    println "<------>替换gradle SDK 版本----->" + details.requested.name + ":" + details.requested.version + "---为--->" + flavor.sdk.zy + "------>"
                                } else if (details.requested.name == 'ad-plugin-csj') {
                                    details.useVersion flavor.sdk.csj
//                                    println "<------>替换gradle SDK 版本----->" + details.requested.name + ":" + details.requested.version + "---为--->" + flavor.sdk.csj + "------>"
                                } else if (details.requested.name == 'ad-plugin-tx') {
                                    details.useVersion flavor.sdk.tx
//                                    println "<------>替换gradle SDK 版本----->" + details.requested.name + ":" + details.requested.version + "---为--->" + flavor.sdk.tx + "------>"
                                } else if (details.requested.name == 'layout') {
                                    details.useVersion layout
//                                    println "<------>替换gradle SDK 版本----->" + details.requested.name + ":" + details.requested.version + "---为--->"+ layout +"------>"
                                }
                            } else if (details.requested.group == 'com.umeng.umsdk') {
                                if (details.requested.name == 'common') {
                                    details.useVersion flavor.sdk.um
                                }
                                if (details.requested.name == 'uverify') {
                                    details.useVersion uverify
                                }
                            } else if (details.requested.group == 'com.github.getActivity') {
                                if (details.requested.name == 'XXPermissions') {
                                    details.useVersion xxpers
//                                    println "<------>替换权限申请框架版本-18.0---->"
                                }
                            } else if (details.requested.group == 'com.alipay.sdk') {
                                if (details.requested.name == 'alipaysdk-android') {
                                    details.useVersion '+'
//                                    println "<------>替换支付宝版本-${details.requested}---->"
                                }
                            }
                        }
                    }
                }
                println "<------>更新SDK依赖信息-结束--用时-【" + (System.currentTimeMillis() / 1000) - start + "】秒->"
            }
            println "<-------------------------------------------------------------------------------------->"
