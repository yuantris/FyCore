                    flavor.sdk.csj = flavor.sdk.csj + "xiaomi"
                }
            }

            if (flavors[0].channels && flavors[0].channels.size() > 0) {
                flavors[0].channels.each {
                    channel ->
                        if (isNoTx) {
                            isNoTx = channel.show == null || channel.show == 0 || channel.show == 3;
                        }
                }
            }
            if (isNoTx) {
                flavor.sdk.tx = flavor.sdk.tx + "clean"
            }

