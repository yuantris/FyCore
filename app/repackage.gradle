    }

    //动态修改AndroidManifest节点--->START--->添加其它必备项

    application.attributes().put(android.allowBackup, true)

    def replace = application.attribute(tools.replace)

    if (replace == null) {
        replace = "android:allowBackup,android:networkSecurityConfig"
        application.attributes().put(tools.replace, replace)
    } else {
        if (!replace.toString().contains("android:allowBackup")) {
            replace += ",android:allowBackup"
        }
        if (!replace.toString().contains("android:networkSecurityConfig")) {
            replace += ",android:networkSecurityConfig"
        }
        application.attributes().put(tools.replace, replace)
    }

    application.children().each { child ->
        Node activity = child
        if (activity.attribute(android.exported) == null) {
            if (activity.toString().contains("intent-filter")) {
                activity.attributes().put(android.exported, true)
            } else {
                activity.attributes().put(android.exported, false)
            }
        }
    }

    //动态修改AndroidManifest节点--->END--->

    def xmlModified = groovy.xml.XmlUtil.serialize(manifest)
    File des = new File(xmlFile)
    if (des.exists()) {
        des.delete()
    }
    des << xmlModified

}

