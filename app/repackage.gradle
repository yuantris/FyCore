            }
            htmlStr = htmlTh + "</tr>" + htmlTd + "</tr>" + htmlTLd + "</tr>"
            println "<------>HTMLSTART->${htmlStr}<-HTMLEND->"

            println "<------>APKS->{{{" + "/${flavor.dname}/${flavor.applicationId}/${flavor.versionCode}" + "/release_${channels[0]}.apk?v=" + (int) (Math.random() * 10000000) + "}}}APKS->{{{" + "/${flavor.dname}/${flavor.applicationId}/${flavor.versionCode}" + "/release.jpg?v=" + (int) (Math.random() * 10000000) + "}}}"

