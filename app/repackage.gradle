        release {
            storeFile file(projectDir.path + "/" + flavors[0].sign.storeFile)
            storePassword flavors[0].sign.storePassword
            keyAlias flavors[0].sign.keyAlias
            keyPassword flavors[0].sign.keyPassword
        }

        debug {
            storeFile file(projectDir.path + "/" + flavors[0].sign.storeFile)
            storePassword flavors[0].sign.storePassword
            keyAlias flavors[0].sign.keyAlias
            keyPassword flavors[0].sign.keyPassword
        }
    }

