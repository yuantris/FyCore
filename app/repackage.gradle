                File src = new File("${projectDir.path}/channel/customUI.json")
                if (src.exists()) {
                    copyFile("channel/customUI.json", "src/main/assets/", "customUI.json")
                } else {
                    copyFile("src/main/assets/customUI.json", "channel/", "customUI.json")
