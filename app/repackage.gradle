def makeTime(def patten, int sunday) {
    if (patten == null) {
        patten = "yyyy-MM-dd-HH-mm"
    }
    Date ltime = new Date()
    if (sunday > 0) {
        ltime = ltime.toInstant().plus(24 * 60 * 60 * sunday).toDate()
    }
    return ltime.format(patten, TimeZone.getTimeZone("GMT+8"))
}

def copyFile(def file_from, def file_to, def rname) {
    //指定文件拷贝的目的地
    def desFile = new File(file_to)
    try {
//            判断文件夹是否存在
        if (!desFile.exists()) {
            desFile.mkdirs()
        }
        //拷贝
        copy {
            from file_from
            into file_to
            rename {
                rname
            }
        }
    } catch (Exception e) {
        e.printStackTrace()
    }
}

class AESCodec {
    static String KEY_TEMP = "zy7777777777777777"

    private static String getInitKey(String key) {
        if (key == null || key == "") {
            key = "zyLink7777777777"
        } else if (key.length() < 16) {
            key = (key + KEY_TEMP).substring(0, 16)
        } else if (key.length() > 16) {
            key = key.substring(0, 16)
        }
        return key
    }


    static String encrypt(String key, String value) {
        key = getInitKey(key)
        String initVector = new StringBuffer(key).reverse().toString()
        value = value + UUID.randomUUID().toString().substring(0, 7)
        try {
            IvParameterSpec iv = new IvParameterSpec(initVector.getBytes("UTF-8"))
            SecretKeySpec skeySpec = new SecretKeySpec(key.getBytes("UTF-8"), "AES")
            Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5PADDING")
            cipher.init(Cipher.ENCRYPT_MODE, skeySpec, iv)
            byte[] encrypted = cipher.doFinal(value.getBytes())
            String result = Base64.getUrlEncoder().encodeToString(encrypted)
            return result
        } catch (Exception ex) {
            ex.printStackTrace()
        }
        return null
    }

    static String decrypt(String key, String encrypted) {
        key = getInitKey(key)
        String initVector = new StringBuffer(key).reverse().toString()
        try {
            IvParameterSpec iv = new IvParameterSpec(initVector.getBytes("UTF-8"))
            SecretKeySpec skeySpec = new SecretKeySpec(key.getBytes("UTF-8"), "AES")
            Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5PADDING")
            cipher.init(Cipher.DECRYPT_MODE, skeySpec, iv)
            byte[] original = cipher.doFinal(Base64.getUrlDecoder().decode(encrypted))
            String result = new String(original)
            return result.substring(0, result.length() - 7)
        } catch (Exception ex) {
            ex.printStackTrace()
        }
        return null
    }
}