        release {
            minifyEnabled true//是否混淆
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release//配置签名文件
        }

        debug {
            minifyEnabled false//是否混淆
