            println "<------>PCK->{{{" + flavor.applicationId + "}}}"
            println "<------>VCODE->{{{" + flavor.versionCode + "}}}"
            println "<------>VNAME->{{{" + flavor.versionName + "}}}"
            println "<------>SDK->{{{" + flavor.sdk + "}}}"

