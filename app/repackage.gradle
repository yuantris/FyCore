                if (umv >= 977) {
                    asms = "1.8.3"
                    apm = "1.9.11"
                    uyumao = "1.1.4"
					nns = "1.1.0"
					uverify = "2.6.4"
					uverifylog = "2.2.2"
					uverifymain = "2.2.3"
                }else if (umv >= 975) {
                    asms = "1.8.3"
                    apm = "1.9.8"
                    uyumao = "1.1.2"
					uverify = "2.6.4"
					uverifylog = "2.2.2"
					uverifymain = "2.2.3"
                }else if (umv >= 973) {
                    asms = "1.8.3"
                    apm = "1.9.8"
                    uyumao = "1.1.2"
					uverify = "2.6.3"
					uverifylog = "2.2.2"
					uverifymain = "2.2.3"
                } else if (umv >= 972) {
                    asms = "1.8.0"
                    apm = "1.9.5"
                    uyumao = "1.1.2"
					uverify = "2.6.2"
					uverifylog = "2.2.2"
					uverifymain = "2.2.3"
                }


                long start = System.currentTimeMillis() / 1000
                println "<-------------------------------------------------------------------------------------->"
                println "<---------------------------------更新SDK依赖信息--------------------------------------->"
                println "<-------------------------------------------------------------------------------------->"

                println "<------>替换 gradle ZYSDK【ad-core】       到最新版本----->" + flavor.sdk.zy + "----------------------->"
                println "<------>替换 gradle ZYSDK【ad-plugin-csj】 到最新版本----->" + flavor.sdk.csj + "---------------------->"
                println "<------>替换 gradle ZYSDK【ad-plugin-tx】  到最新版本----->" + flavor.sdk.tx + "------------------->"
                println "<------>替换 gradle ZYSDK【layout】        到最新版本----->${layout}------------------------->"

                println "<------>替换 gradle UMSDK【common】        到最新版本----->" + flavor.sdk.um + "------------------------>"
