// maven-credentials.gradle
// 统一管理私有 Maven 仓库凭据：优先级 local.properties > gradle.properties > 环境变量
// 凭据严禁硬编码提交到版本库（历史泄露的凭据请尽快在云效后台轮换）

ext.fyMavenCredentials = {
    def props = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { props.load(it) }
    }
    def resolve = { String key ->
        props.getProperty(key)
                ?: project.findProperty(key)
                ?: System.getenv(key.toUpperCase().replace('.', '_'))
    }
    [
            username: resolve('fy.maven.username'),
            password: resolve('fy.maven.password')
    ]
}

// version 为空：同时挂 release + snapshot 两个仓库（兼容旧脚本）
// version 以 -SNAPSHOT 结尾：仅挂 snapshot 仓库；否则仅挂 release 仓库
ext.fyMavenRepos = { handler, version = null ->
    def cred = fyMavenCredentials()
    if (cred.username && cred.password) {
        def isSnapshot = version != null && version.toString().endsWith('SNAPSHOT')
        if (version == null || isSnapshot) {
            handler.maven {
                name = 'aliyunSnapshot'
                url = 'https://packages.aliyun.com/maven/repository/2512815-snapshot-TM86u0/'
                credentials {
                    username cred.username
                    password cred.password
                }
            }
        }
        if (version == null || !isSnapshot) {
            handler.maven {
                name = 'aliyunRelease'
                url = 'https://packages.aliyun.com/maven/repository/2512815-release-NDmHZu/'
                credentials {
                    username cred.username
                    password cred.password
                }
            }
        }
    } else {
        println '[fy-maven] 未配置 fy.maven.username / fy.maven.password，跳过私有仓库发布配置'
    }
}
